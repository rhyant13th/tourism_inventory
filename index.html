<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourism Enterprise & Attraction Inventory - Advanced Dashboard</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAhfpg6aVJlazzuyelcPILDzEVtqdlBrKw",
      authDomain: "tourism-inventory-e44d0.firebaseapp.com",

    firebase.initializeApp(firebaseConfig);
    window.db = firebase.firestore();

  <style>
    :root {
      --navy: #0E3B3C;
      --navy-deep: #092726;
      --teal: #1C6B6E;
      --teal-soft: #DCEBE9;
      --gold: #C08A2E;
      --gold-soft: #F2E2C1;
      --bg: #F4F6F5;
      --card: #FFFFFF;
      --border: #DFE5E3;
      --text: #16211F;
      --subtext: #5E6E6A;
      --danger: #A8442D;
      --danger-soft: #F3E0DA;
      --success: #2B7A57;
      --success-soft: #E8F5F0;
      --warning: #D97706;
      --warning-soft: #FEF3C7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    h1, h2, h3 {
      font-family: Georgia, 'Iowan Old Style', serif;
      margin: 0;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .title {
      font-size: 32px;
      color: var(--navy);
      margin-top: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--subtext);
      margin-top: 6px;
    }

    .section-tabs {
      display: flex;
      gap: 8px;
      margin: 24px 0;
      flex-wrap: wrap;
    }

    .section-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      cursor: pointer;
      transition: all 0.2s;
    }

    .section-tab:hover {
      border-color: var(--teal);
    }

    .section-tab.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .view-toggle {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 8px;
      background: var(--teal-soft);
    }

    .view-toggle button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--navy);
      cursor: pointer;
    }

    .view-toggle button.active {
      background: var(--navy);
      color: #fff;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--teal), var(--gold));
    }

    .stat-card.warning::before {
      background: var(--warning);
    }

    .stat-card.success::before {
      background: var(--success);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .stat-value {
      font-family: Georgia, serif;
      font-size: 32px;
      color: var(--navy);
      margin-top: 8px;
      font-weight: bold;
    }

    .stat-subvalue {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 4px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .charts-grid.full {
      grid-template-columns: 1fr;
    }

    .alert-box {
      background: var(--warning-soft);
      border-left: 4px solid var(--warning);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .alert-box.danger {
      background: var(--danger-soft);
      border-left-color: var(--danger);
    }

    .alert-box.success {
      background: var(--success-soft);
      border-left-color: var(--success);
    }

    /* Download Filter Section */
    .filter-panel {
      background: linear-gradient(135deg, var(--gold-soft) 0%, #FFF8E7 100%);
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .filter-panel h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 16px 0;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .filter-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: var(--text);
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2px var(--teal-soft);
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .btn-primary:hover {
      background: var(--navy-deep);
      border-color: var(--navy-deep);
    }

    .btn-download {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .btn-download:hover {
      background: #A87428;
      border-color: #A87428;
    }

    .btn-pdf {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .btn-secondary {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: var(--navy);
      color: #fff;
    }

    th {
      text-align: left;
      padding: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    td {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    tr:nth-child(odd) {
      background: var(--bg);
    }

    .empty-row {
      text-align: center;
      padding: 32px !important;
      color: var(--subtext);
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .pill-teal {
      background: var(--teal-soft);
      color: var(--teal);
    }

    .pill-gold {
      background: var(--gold-soft);
      color: #8A5F16;
    }

    .pill-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .pill-success {
      background: var(--success-soft);
      color: var(--success);
    }

    .pill-grey {
      background: #EDEFEE;
      color: var(--subtext);
    }

    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bar-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bar-label {
      width: 120px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: var(--teal-soft);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.2s;
    }

    .bar-track:hover {
      background: var(--teal);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), #0A9AA8);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .comparison-item {
      background: var(--bg);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .comparison-label {
      font-size: 11px;
      color: var(--subtext);
      text-transform: uppercase;
      font-weight: 600;
    }

    .comparison-value {
      font-size: 24px;
      font-weight: bold;
      color: var(--navy);
      margin-top: 4px;
    }

    .timeline {
      position: relative;
      padding: 20px 0;
    }

    .timeline-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      padding-left: 40px;
      position: relative;
    }

    .timeline-dot {
      position: absolute;
      left: 8px;
      top: 0;
      width: 24px;
      height: 24px;
      background: var(--teal);
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px var(--border);
    }

    .timeline-item.expiring .timeline-dot {
      background: var(--warning);
    }

    .timeline-item.expired .timeline-dot {
      background: var(--danger);
    }

    .timeline-line {
      position: absolute;
      left: 19px;
      top: 24px;
      bottom: -16px;
      width: 2px;
      background: var(--border);
    }

    .timeline-content {
      flex: 1;
    }

    .timeline-title {
      font-weight: 600;
      color: var(--text);
    }

    .timeline-meta {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 4px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 768px) {
      .stat-cards {
        grid-template-columns: 1fr;
      }

      .charts-grid {
        grid-template-columns: 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==================== CONSTANTS ====================
    const MUNICIPALITIES = ["Abra de Ilog", "Calintaan", "Looc", "Lubang", "Magsaysay", "Mamburao", "Paluan", "Rizal", "Sablayan", "San Jose", "Sta. Cruz"];
    const CLASSIFICATIONS = ["Primary Enterprises", "Secondary Enterprises"];
    const PRIMARY_TYPES = ["Hotel", "Resort", "Apartment Hotel", "Mabuhay Accommodation", "Homestay", "Travel and Tour Agency", "Tour Operator", "Land Transport Operator", "MICE Venue/Facility", "Tour Guides"];
    const SECONDARY_TYPES = ["Farm Tourism Camp", "Restaurant", "Dive Shop", "Tourism Recreation Center", "Spa", "Rest Area"];
    const ALL_TYPES = [...PRIMARY_TYPES, ...SECONDARY_TYPES];

    const ATTRACTION_CATEGORIES = ["Nature", "History and Culture", "Industrial Tourism", "Sports and Recreational", "Shopping", "Health and Wellness"];
    const ATTRACTION_STATUSES = ["Existing", "Potential", "Emerging"];
    const DECLARATION_STATUSES = ["Nationally Declared", "Locally Declared", "Registered", "Unregistered"];

    // Only this email can edit/download. Everyone else is view-only.
    const ADMIN_EMAILS = ["rhyant13th@gmail.com"];

    // ==================== UTILITY FUNCTIONS ====================
    function exportToExcel(data, fileName) {
      if (!data || data.length === 0) {
        alert("No data to export");
        return;
      }
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Data");
      ws['!cols'] = Object.keys(data[0] || {}).map(() => ({ wch: 18 }));
      XLSX.writeFile(wb, `${fileName}_${new Date().toLocaleDateString()}.xlsx`);
    }

    function generatePDFReport(title, content) {
      const element = document.createElement('div');
      element.innerHTML = content;
      const opt = {
        margin: 10,
        filename: `${title}_${new Date().toLocaleDateString()}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
      };
      html2pdf().set(opt).from(element).save();
    }

    // ==================== FILTER AND EXPORT ====================
    function FilteredDownload({ data, type, isAdmin }) {
      const [filters, setFilters] = useState({});
      const [filteredData, setFilteredData] = useState(data);

      const updateFilter = (field, value) => {
        setFilters(prev => ({ ...prev, [field]: value }));
      };

      useEffect(() => {
        let result = [...data];

        if (type === 'enterprises') {
          if (filters.municipality) result = result.filter(d => d.municipality === filters.municipality);
          if (filters.classification) result = result.filter(d => d.classification === filters.classification);
          if (filters.type) result = result.filter(d => d.type === filters.type);
          if (filters.accreditation) result = result.filter(d => {
            const status = d.accredStatus || 'Not Accredited';
            return status === filters.accreditation;
          });
        } else if (type === 'attractions') {
          if (filters.municipality) result = result.filter(d => d.municipality === filters.municipality);
          if (filters.category) result = result.filter(d => d.category === filters.category);
          if (filters.status) result = result.filter(d => d.selection === filters.status);
          if (filters.declarationStatus) result = result.filter(d => d.declarationStatus === filters.declarationStatus);
        }

        setFilteredData(result);
      }, [filters, data, type]);

      const handleDownload = () => {
        if (!isAdmin) {
          alert("View-only access: downloading is restricted to the administrator.");
          return;
        }
        if (filteredData.length === 0) {
          alert("No data matches your filters");
          return;
        }

        const exportData = filteredData.map(d => {
          if (type === 'enterprises') {
            return {
              'Name': d.name,
              'Municipality': d.municipality,
              'Classification': d.classification,
              'Type': d.type,
              'Address': d.address,
              'Contact': d.contact,
              'Accreditation Status': d.accredStatus || 'Not Accredited'
            };
          } else {
            return {
              'Name': d.name,
              'Municipality': d.municipality,
              'Category': d.category,
              'Status': d.selection,
              'Declaration Status': d.declarationStatus,
              'Address': d.address
            };
          }
        });

        const filterName = Object.entries(filters)
          .filter(([, v]) => v)
          .map(([k, v]) => `${k}-${v}`)
          .join('_') || 'all';

        exportToExcel(exportData, `${type}_${filterName}`);
      };

      const clearFilters = () => {
        setFilters({});
      };

      return (
        <div className="filter-panel">
          <h3>🔍 Smart Download Filters</h3>
          <div className="filter-grid">
            {type === 'enterprises' ? (
              <>
                <div className="filter-field">
                  <label className="filter-label">Municipality</label>
                  <select 
                    className="filter-input" 
                    value={filters.municipality || ''} 
                    onChange={(e) => updateFilter('municipality', e.target.value)}
                  >
                    <option value="">All Municipalities</option>
                    {MUNICIPALITIES.map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
                <div className="filter-field">
                  <label className="filter-label">Classification</label>
                  <select 
                    className="filter-input" 
                    value={filters.classification || ''} 
                    onChange={(e) => updateFilter('classification', e.target.value)}
                  >
                    <option value="">All Classifications</option>
                    {CLASSIFICATIONS.map(c => (
                      <option key={c} value={c}>{c}</option>
                    ))}
                  </select>
                </div>
                <div className="filter-field">
                  <label className="filter-label">Type</label>
                  <select 
                    className="filter-input" 
                    value={filters.type || ''} 
                    onChange={(e) => updateFilter('type', e.target.value)}
                  >
                    <option value="">All Types</option>
                    {ALL_TYPES.map(t => (
                      <option key={t} value={t}>{t}</option>
                    ))}
                  </select>
                </div>
                <div className="filter-field">
                  <label className="filter-label">Accreditation Status</label>
                  <select 
                    className="filter-input" 
                    value={filters.accreditation || ''} 
                    onChange={(e) => updateFilter('accreditation', e.target.value)}
                  >
                    <option value="">All Status</option>
                    <option value="Accredited">Accredited</option>
                    <option value="Expired">Expired</option>
                    <option value="Not Accredited">Not Accredited</option>
                  </select>
                </div>
              </>
            ) : (
              <>
                <div className="filter-field">
                  <label className="filter-label">Municipality</label>
                  <select 
                    className="filter-input" 
                    value={filters.municipality || ''} 
                    onChange={(e) => updateFilter('municipality', e.target.value)}
                  >
                    <option value="">All Municipalities</option>
                    {MUNICIPALITIES.map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
                <div className="filter-field">
                  <label className="filter-label">Category</label>
                  <select 
                    className="filter-input" 
                    value={filters.category || ''} 
                    onChange={(e) => updateFilter('category', e.target.value)}
                  >
                    <option value="">All Categories</option>
                    {ATTRACTION_CATEGORIES.map(c => (
                      <option key={c} value={c}>{c}</option>
                    ))}
                  </select>
                </div>
                <div className="filter-field">
                  <label className="filter-label">Status</label>
                  <select 
                    className="filter-input" 
                    value={filters.status || ''} 
                    onChange={(e) => updateFilter('status', e.target.value)}
                  >
                    <option value="">All Status</option>
                    {ATTRACTION_STATUSES.map(s => (
                      <option key={s} value={s}>{s}</option>
                    ))}
                  </select>
                </div>
                <div className="filter-field">
                  <label className="filter-label">Declaration Status</label>
                  <select 
                    className="filter-input" 
                    value={filters.declarationStatus || ''} 
                    onChange={(e) => updateFilter('declarationStatus', e.target.value)}
                  >
                    <option value="">All Declaration Status</option>
                    {DECLARATION_STATUSES.map(ds => (
                      <option key={ds} value={ds}>{ds}</option>
                    ))}
                  </select>
                </div>
              </>
            )}
          </div>

          <div className="filter-actions">
            {isAdmin ? (
              <button className="btn btn-download" onClick={handleDownload}>
                📥 Download ({filteredData.length} records)
              </button>
            ) : (
              <span style={{ fontSize: 13, color: "#8a5a00", fontStyle: "italic" }}>
                🔒 View-only access — downloading is disabled for your account.
              </span>
            )}
            <button className="btn" onClick={clearFilters}>
              🔄 Clear Filters
            </button>
          </div>
        </div>
      );
    }

    // ==================== ENHANCED DASHBOARD ====================
    function EnterprisesDashboard({ data, isAdmin }) {
      const byMunicipality = useMemo(() => {
        const m = {};
        data.forEach(d => { m[d.municipality] = (m[d.municipality] || 0) + 1; });
        return Object.entries(m).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      }, [data]);

      const byType = useMemo(() => {
        const m = {};
        data.forEach(d => { m[d.type] = (m[d.type] || 0) + 1; });
        return Object.entries(m).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      }, [data]);

      const accredStats = useMemo(() => {
        const accredited = data.filter(d => d.accredStatus === 'Accredited').length;
        const expired = data.filter(d => d.accredStatus === 'Expired').length;
        const notAccred = data.filter(d => !d.accredStatus || d.accredStatus === 'Not Accredited').length;
        return { accredited, expired, notAccred };
      }, [data]);

      const expiringAccreditations = useMemo(() => {
        const now = new Date();
        return data.filter(d => {
          if (!d.accredValidity) return false;
          const expiry = new Date(d.accredValidity);
          const daysUntilExpiry = (expiry - now) / (1000 * 60 * 60 * 24);
          return daysUntilExpiry > 0 && daysUntilExpiry <= 90;
        }).sort((a, b) => new Date(a.accredValidity) - new Date(b.accredValidity)).slice(0, 5);
      }, [data]);

      const totalEmployees = useMemo(() => {
        return data.reduce((sum, d) => sum + (Number(d.maleEmployees) || 0) + (Number(d.femaleEmployees) || 0), 0);
      }, [data]);

      const maleEmployees = useMemo(() => {
        return data.reduce((sum, d) => sum + (Number(d.maleEmployees) || 0), 0);
      }, [data]);

      const femaleEmployees = useMemo(() => {
        return data.reduce((sum, d) => sum + (Number(d.femaleEmployees) || 0), 0);
      }, [data]);

      const topMunicipality = byMunicipality[0];
      const topType = byType[0];

      return (
        <div>
          <div className="stat-cards">
            <div className="stat-card">
              <div className="stat-label">Total Enterprises</div>
              <div className="stat-value">{data.length}</div>
            </div>
            <div className="stat-card success">
              <div className="stat-label">Accredited</div>
              <div className="stat-value">{accredStats.accredited}</div>
              <div className="stat-subvalue">{((accredStats.accredited / data.length) * 100).toFixed(1)}%</div>
            </div>
            <div className="stat-card warning">
              <div className="stat-label">Expired/Expiring Soon</div>
              <div className="stat-value">{accredStats.expired + expiringAccreditations.length}</div>
              <div className="stat-subvalue">{expiringAccreditations.length} expiring in 90 days</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Active/Operating</div>
              <div className="stat-value">{data.filter(d => d.status === 'Active').length}</div>
              <div className="stat-subvalue">On TourLISTA: {data.filter(d => d.tourlista === 'Yes').length}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Total Employees</div>
              <div className="stat-value">{totalEmployees}</div>
              <div className="stat-subvalue">M: {maleEmployees} | F: {femaleEmployees}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Municipalities</div>
              <div className="stat-value">{new Set(data.map(d => d.municipality)).size}</div>
              <div className="stat-subvalue">Top: {topMunicipality?.name}</div>
            </div>
          </div>

          {expiringAccreditations.length > 0 && (
            <div className="alert-box danger">
              ⚠️ <strong>{expiringAccreditations.length} accreditations expiring within 90 days!</strong> Review the timeline below.
            </div>
          )}

          <FilteredDownload data={data} type="enterprises" isAdmin={isAdmin} />

          <div className="charts-grid">
            <div className="panel">
              <div className="panel-title">📊 Enterprises by Municipality</div>
              <div className="bar-chart">
                {byMunicipality.map((m, i) => (
                  <div key={i} className="bar-item">
                    <div className="bar-label">{m.name}</div>
                    <div className="bar-track" style={{ minWidth: '100px' }}>
                      <div className="bar-fill" style={{ width: `${(m.count / byMunicipality[0].count) * 100}%` }}>
                        {m.count}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="panel">
              <div className="panel-title">🏢 Top Enterprise Types</div>
              <div className="bar-chart">
                {byType.slice(0, 8).map((t, i) => (
                  <div key={i} className="bar-item">
                    <div className="bar-label">{t.name}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{ width: `${(t.count / byType[0].count) * 100}%` }}>
                        {t.count}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {expiringAccreditations.length > 0 && (
            <div className="panel">
              <div className="panel-title">📅 Accreditations Expiring Soon</div>
              <div className="timeline">
                {expiringAccreditations.map((e, i) => (
                  <div key={i} className="timeline-item expiring">
                    <div className="timeline-dot"></div>
                    <div className="timeline-content">
                      <div className="timeline-title">{e.name}</div>
                      <div className="timeline-meta">
                        📍 {e.municipality} | Valid until: {new Date(e.accredValidity).toLocaleDateString()}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== ATTRACTIONS DASHBOARD ====================
    function AttractionsDashboard({ data, isAdmin }) {
      const byMunicipality = useMemo(() => {
        const m = {};
        data.forEach(d => { m[d.municipality] = (m[d.municipality] || 0) + 1; });
        return Object.entries(m).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      }, [data]);

      const byCategory = useMemo(() => {
        const m = {};
        data.forEach(d => { m[d.category] = (m[d.category] || 0) + 1; });
        return Object.entries(m).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      }, [data]);

      const statusBreakdown = useMemo(() => {
        return {
          existing: data.filter(d => d.selection === 'Existing').length,
          potential: data.filter(d => d.selection === 'Potential').length,
          emerging: data.filter(d => d.selection === 'Emerging').length,
          declared: data.filter(d => d.declarationStatus && (d.declarationStatus.includes('Declared') || d.declarationStatus === 'Registered')).length
        };
      }, [data]);

      const topMunicipality = byMunicipality[0];
      const topCategory = byCategory[0];

      return (
        <div>
          <div className="stat-cards">
            <div className="stat-card">
              <div className="stat-label">Total Attractions</div>
              <div className="stat-value">{data.length}</div>
            </div>
            <div className="stat-card success">
              <div className="stat-label">Existing Attractions</div>
              <div className="stat-value">{statusBreakdown.existing}</div>
              <div className="stat-subvalue">{((statusBreakdown.existing / data.length) * 100).toFixed(1)}%</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Potential Attractions</div>
              <div className="stat-value">{statusBreakdown.potential}</div>
              <div className="stat-subvalue">Development opportunities</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Officially Declared</div>
              <div className="stat-value">{statusBreakdown.declared}</div>
              <div className="stat-subvalue">National/Local/Registered</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Municipalities</div>
              <div className="stat-value">{new Set(data.map(d => d.municipality)).size}</div>
              <div className="stat-subvalue">Top: {topMunicipality?.name}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Top Category</div>
              <div className="stat-value">{topCategory?.name}</div>
              <div className="stat-subvalue">{topCategory?.count} attractions</div>
            </div>
          </div>

          <FilteredDownload data={data} type="attractions" isAdmin={isAdmin} />

          <div className="charts-grid">
            <div className="panel">
              <div className="panel-title">📍 Attractions by Municipality</div>
              <div className="bar-chart">
                {byMunicipality.map((m, i) => (
                  <div key={i} className="bar-item">
                    <div className="bar-label">{m.name}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{ width: `${(m.count / byMunicipality[0].count) * 100}%` }}>
                        {m.count}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="panel">
              <div className="panel-title">🏛️ Attractions by Category</div>
              <div className="bar-chart">
                {byCategory.map((c, i) => (
                  <div key={i} className="bar-item">
                    <div className="bar-label">{c.name}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{ width: `${(c.count / byCategory[0].count) * 100}%` }}>
                        {c.count}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-title">📊 Status Distribution</div>
            <div className="comparison-grid">
              <div className="comparison-item">
                <div className="comparison-label">Existing</div>
                <div className="comparison-value" style={{ color: '#2B7A57' }}>{statusBreakdown.existing}</div>
              </div>
              <div className="comparison-item">
                <div className="comparison-label">Potential</div>
                <div className="comparison-value" style={{ color: '#C08A2E' }}>{statusBreakdown.potential}</div>
              </div>
              <div className="comparison-item">
                <div className="comparison-label">Emerging</div>
                <div className="comparison-value" style={{ color: '#1C6B6E' }}>{statusBreakdown.emerging}</div>
              </div>
              <div className="comparison-item">
                <div className="comparison-label">Declared</div>
                <div className="comparison-value" style={{ color: '#0E3B3C' }}>{statusBreakdown.declared}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [tab, setTab] = useState("enterprises");
      const [establishments, setEstablishments] = useState([]);
      const [attractions, setAttractions] = useState([]);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [loginLoading, setLoginLoading] = useState(false);

      // Only this email can edit/download. Everyone else is view-only.
      const isAdmin = !!(user && ADMIN_EMAILS.includes(user.email));

      useEffect(() => {
        const unsub = window.auth.onAuthStateChanged(u => {
          setUser(u);
          setAuthReady(true);
        });
        return unsub;
      }, []);

      const handleSignIn = (e) => {
        e.preventDefault();
        setLoginError("");
        if (!loginEmail || !loginPassword) {
          setLoginError("Please enter both email and password.");
          return;
        }
        setLoginLoading(true);
        window.auth.signInWithEmailAndPassword(loginEmail, loginPassword)
          .catch(err => {
            setLoginError(err.message || "Sign in failed. Please check your credentials.");
          })
          .finally(() => setLoginLoading(false));
      };

      useEffect(() => {
        if (!user) return;
        window.db.collection("inventory").doc("data").get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            setEstablishments(data.establishments || []);
            setAttractions(data.attractions || []);
          }
        }).catch(err => console.error("Load error:", err));
      }, [user]);

      const handleLogout = () => window.auth.signOut();

      if (!authReady) {
        return <div className="app" style={{ textAlign: "center", paddingTop: 100 }}>Checking authentication…</div>;
      }

      if (!user) {
        return (
          <div className="app" style={{ maxWidth: 420, marginTop: 80 }}>
            <div className="eyebrow">PROVINCIAL TOURISM OFFICE</div>
            <h1 className="title" style={{ fontSize: 24 }}>Sign in</h1>
            <p className="subtitle">Enter credentials to access the advanced dashboard.</p>
            <form onSubmit={handleSignIn} style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 12 }}>
              <div className="filter-field">
                <label className="filter-label">Email</label>
                <input
                  type="email"
                  className="filter-input"
                  value={loginEmail}
                  onChange={(e) => setLoginEmail(e.target.value)}
                  placeholder="you@example.com"
                  autoComplete="username"
                  required
                />
              </div>
              <div className="filter-field">
                <label className="filter-label">Password</label>
                <input
                  type="password"
                  className="filter-input"
                  value={loginPassword}
                  onChange={(e) => setLoginPassword(e.target.value)}
                  placeholder="••••••••"
                  autoComplete="current-password"
                  required
                />
              </div>
              {loginError && (
                <div className="alert-box danger" style={{ margin: 0 }}>{loginError}</div>
              )}
              <button type="submit" className="btn btn-primary" style={{ width: "100%" }} disabled={loginLoading}>
                {loginLoading ? "Signing in…" : "Sign in"}
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="app">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24, flexWrap: "wrap", gap: 16 }}>
            <div>
              <div className="eyebrow">PROVINCIAL TOURISM OFFICE</div>
              <h1 className="title">Advanced Tourism Dashboard</h1>
              <p className="subtitle">Analytics & Smart Download Filters by <strong>RYAN R. TAJONERA</strong>, Tourism Operations Officer II</p>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 13, color: isAdmin ? "#0E3B3C" : "#8a5a00" }}>
                {user.email} · {isAdmin ? "Admin" : "View only"}
              </span>
              <button className="btn" onClick={handleLogout}>Sign out</button>
            </div>
          </div>

          <div className="section-tabs">
            <button className={"section-tab " + (tab === "enterprises" ? "active" : "")} onClick={() => setTab("enterprises")}>
              📊 Enterprises Analytics ({establishments.length})
            </button>
            <button className={"section-tab " + (tab === "attractions" ? "active" : "")} onClick={() => setTab("attractions")}>
              🏛️ Attractions Analytics ({attractions.length})
            </button>
          </div>

          {tab === "enterprises" && <EnterprisesDashboard data={establishments} isAdmin={isAdmin} />}
          {tab === "attractions" && <AttractionsDashboard data={attractions} isAdmin={isAdmin} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
