  <!-- Application Styles -->
  <style>

      --navy: #0E3B3C; --navy-deep: #092726; --teal: #1C6B6E; --teal-soft: #DCEBE9;
      --gold: #C08A2E; --gold-soft: #F2E2C1; --bg: #F4F6F5; --card: #FFFFFF;
      --border: #DFE5E3; --text: #16211F; --subtext: #5E6E6A; --danger: #A8442D;
      --danger-soft: #F3E0DA; --success: #2B7A57;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif; }
    h1, h2, h3 { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; margin: 0; }
    .app { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--teal); letter-spacing: .03em; margin-bottom: 4px; }
    .title { font-size: 30px; color: var(--navy); }
    .subtitle { font-size: 14px; color: var(--subtext); max-width: 640px; margin-top: 6px; }

    .download-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn-download:hover { background: #A87428; }

    .data-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    .data-toolbar .grow { flex: 1; min-width: 160px; font-size: 12px; color: var(--subtext); }
    .data-toolbar .grow b { color: var(--navy); }
    .btn-outline-teal { border-color: var(--teal); color: var(--teal); background: #fff; }
    .btn-outline-gold { border-color: var(--gold); color: #8A5F16; background: #fff; }
    input[type=file] { display: none; }

    .section-tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .section-tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--border); background: #fff; color: var(--navy); cursor: pointer; }
    .section-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    .view-toggle { display: inline-flex; gap: 4px; padding: 4px; border-radius: 8px; background: var(--teal-soft); }
    .view-toggle button { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--navy); cursor: pointer; }
    .view-toggle button.active { background: var(--navy); color: #fff; }

    .toolbar-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--navy); }
    .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-ghost { background: transparent; border: none; padding: 2px; cursor: pointer; }

    .stat-cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .stat-card { flex: 1; min-width: 150px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--subtext); }
    .stat-value { font-family: Georgia, serif; font-size: 28px; color: var(--navy); margin-top: 2px; }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .panel-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }

    .filter-bar { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }

    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill-teal { background: var(--teal-soft); color: var(--teal); }
    .pill-gold { background: var(--gold-soft); color: #8A5F16; }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }
    .pill-grey { background: #EDEFEE; color: var(--subtext); }

    input[type=text], input[type=date], input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--text); background: #fff; outline: none; font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-soft); }

    .field { display: block; margin-bottom: 12px; }
    .field-label { display: block; font-size: 12px; font-weight: 700; color: var(--subtext); margin-bottom: 4px; }
    .field-label .req { color: var(--danger); }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 0 16px; }
    @media(min-width:760px){ .form-grid { grid-template-columns: 1fr 1fr; } }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--border); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(14,59,60,.45); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px; overflow-y: auto; }
    .modal { background: var(--card); border-radius: 14px; width: 100%; max-width: 720px; margin-top: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 18px 20px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ==================== EXPORT UTILITIES ====================
    function exportToExcel(data, fileName, columns = null) {
      if (!data || data.length === 0) {
        alert("No data to export");
        return;
      }
      
      const exportData = columns 
        ? data.map(row => {
            const newRow = {};
            columns.forEach(col => {
              newRow[col] = row[col] || "";
            });
            return newRow;
          })
        : data;

      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Data");
      
      // Auto-size columns
      ws['!cols'] = Object.keys(exportData[0] || {}).map(() => ({ wch: 15 }));
      
      XLSX.writeFile(wb, `${fileName}_${new Date().getTime()}.xlsx`);
    }

    function downloadEnterprisesByMunicipality(enterprises, municipality) {
      const filtered = enterprises.filter(e => e.municipality === municipality);
      exportToExcel(filtered, `Enterprises_${municipality}`, [
        'name', 'municipality', 'classification', 'type', 'accreditationStatus', 'address', 'contactPerson', 'contactNumber'
      ]);
    }

    function downloadEnterprisesByClassification(enterprises, classification) {
      const filtered = enterprises.filter(e => e.classification === classification);
      exportToExcel(filtered, `Enterprises_${classification}`, [
        'name', 'municipality', 'classification', 'type', 'accreditationStatus', 'address', 'contactPerson', 'contactNumber'
      ]);
    }

    function downloadEnterprisesByType(enterprises, type) {
      const filtered = enterprises.filter(e => e.type === type);
      exportToExcel(filtered, `Enterprises_${type}`, [
        'name', 'municipality', 'classification', 'type', 'accreditationStatus', 'address', 'contactPerson', 'contactNumber'
      ]);
    }

    function downloadEnterprisesByAccreditation(enterprises, status) {
      const filtered = enterprises.filter(e => e.accreditationStatus === status);
      exportToExcel(filtered, `Enterprises_Accreditation_${status}`, [
        'name', 'municipality', 'classification', 'type', 'accreditationStatus', 'address', 'contactPerson', 'contactNumber'
      ]);
    }

    function downloadAttractionsByMunicipality(attractions, municipality) {
      const filtered = attractions.filter(a => a.municipality === municipality);
      exportToExcel(filtered, `Attractions_${municipality}`, [
        'name', 'municipality', 'category', 'status', 'declarationStatus', 'address', 'description'
      ]);
    }

    function downloadAttractionsByCategory(attractions, category) {
      const filtered = attractions.filter(a => a.category === category);
      exportToExcel(filtered, `Attractions_${category}`, [
        'name', 'municipality', 'category', 'status', 'declarationStatus', 'address', 'description'
      ]);
    }

    function downloadAttractionsByStatus(attractions, status) {
      const filtered = attractions.filter(a => a.status === status);
      exportToExcel(filtered, `Attractions_${status}`, [
        'name', 'municipality', 'category', 'status', 'declarationStatus', 'address', 'description'
      ]);
    }

    function downloadAttractionsByDeclarationStatus(attractions, declarationStatus) {
      const filtered = attractions.filter(a => a.declarationStatus === declarationStatus);
      exportToExcel(filtered, `Attractions_Declaration_${declarationStatus}`, [
        'name', 'municipality', 'category', 'status', 'declarationStatus', 'address', 'description'
      ]);
    }

    // ==================== CBTO EXPORT ====================
    function downloadCBTOByField(cbtos, field) {
      const columns = [
        'municipality', 'name', 'address', 'contactPerson', 'contactNumber',
        'maleMembers', 'femaleMembers', 'totalMembers', 'natureOfActivity', 'purpose'
      ];
      exportToExcel(cbtos, `CBTOs_${field}`, columns);
    }

    // ==================== LOGIN COMPONENT ====================
    function LoginScreen() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError("");
        setLoading(true);
        try {
          await window.auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      return (
        <div className="app" style={{maxWidth:420, marginTop:80}}>
          <div className="eyebrow">PROVINCIAL TOURISM OFFICE</div>
          <h1 className="title" style={{fontSize:24}}>Sign in</h1>
          <p className="subtitle">Enter your email and password to access the inventory.</p>
          <form onSubmit={handleLogin} style={{marginTop:24}}>
            <label className="field">
              <span className="field-label">Email</span>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoComplete="email" />
            </label>
            <label className="field">
              <span className="field-label">Password</span>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required autoComplete="current-password" />
            </label>
            {error && <div style={{color:"var(--danger)", fontSize:13, marginBottom:12}}>{error}</div>}
            <button className="btn btn-primary" type="submit" disabled={loading} style={{width:"100%"}}>
              {loading ? "Signing in…" : "Sign in"}
            </button>
          </form>
        </div>
      );
    }

    // ==================== ENTERPRISES SECTION ====================
    function EnterprisesSection({ data, setData, isAdmin }) {
      const municipalities = [...new Set(data.map(e => e.municipality))].sort();
      const classifications = [...new Set(data.map(e => e.classification))].filter(Boolean).sort();
      const types = [...new Set(data.map(e => e.type))].filter(Boolean).sort();
      const accreditations = [...new Set(data.map(e => e.accreditationStatus))].filter(Boolean).sort();

      return (
        <div>
          <div className="download-section">
            <h3>📥 Download by Municipality</h3>
            <div className="download-buttons">
              {municipalities.map(m => (
                <button key={m} className="btn-download" onClick={() => downloadEnterprisesByMunicipality(data, m)}>
                  {m}
                </button>
              ))}
            </div>
          </div>

          <div className="download-section">
            <h3>📥 Download by Classification</h3>
            <div className="download-buttons">
              {classifications.map(c => (
                <button key={c} className="btn-download" onClick={() => downloadEnterprisesByClassification(data, c)}>
                  {c}
                </button>
              ))}
            </div>
          </div>

          <div className="download-section">
            <h3>📥 Download by Type</h3>
            <div className="download-buttons">
              {types.map(t => (
                <button key={t} className="btn-download" onClick={() => downloadEnterprisesByType(data, t)}>
                  {t}
                </button>
              ))}
            </div>
          </div>

          <div className="download-section">
            <h3>📥 Download by Accreditation Status</h3>
            <div className="download-buttons">
              {accreditations.map(a => (
                <button key={a} className="btn-download" onClick={() => downloadEnterprisesByAccreditation(data, a)}>
                  {a}
                </button>
              ))}
            </div>
          </div>

          <div className="data-toolbar">
            <span className="grow">Total Enterprises: <b>{data.length}</b></span>
          </div>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Municipality</th>
                  <th>Classification</th>
                  <th>Type</th>
                  <th>Accreditation</th>
                  <th>Address</th>
                </tr>
              </thead>
              <tbody>
                {data.length === 0 ? (
                  <tr><td colSpan="6" className="empty-row">No enterprises found</td></tr>
                ) : (
                  data.map((e, i) => (
                    <tr key={i}>
                      <td><strong>{e.name}</strong></td>
                      <td>{e.municipality}</td>
                      <td><span className="pill pill-teal">{e.classification}</span></td>
                      <td>{e.type}</td>
                      <td><span className="pill pill-gold">{e.accreditationStatus}</span></td>
                      <td style={{fontSize:11, color:"var(--subtext)"}}>{e.address}</td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==================== ATTRACTIONS SECTION ====================
    function AttractionsSection({ data, setData, isAdmin }) {
      const municipalities = [...new Set(data.map(a => a.municipality))].sort();
      const categories = [...new Set(data.map(a => a.category))].filter(Boolean).sort();
      const statuses = [...new Set(data.map(a => a.status))].filter(Boolean).sort();
      const declarationStatuses = [...new Set(data.map(a => a.declarationStatus))].filter(Boolean).sort();

      return (
        <div>
          <div className="download-section">
            <h3>📥 Download by Municipality</h3>
            <div className="download-buttons">
              {municipalities.map(m => (
                <button key={m} className="btn-download" onClick={() => downloadAttractionsByMunicipality(data, m)}>
                  {m}
                </button>
              ))}
            </div>
          </div>

          <div className="download-section">
            <h3>📥 Download by Category</h3>
            <div className="download-buttons">
              {categories.map(c => (
                <button key={c} className="btn-download" onClick={() => downloadAttractionsByCategory(data, c)}>
                  {c}
                </button>
              ))}
            </div>
          </div>

          <div className="download-section">
            <h3>📥 Download by Status</h3>
            <div className="download-buttons">
              {statuses.map(s => (
                <button key={s} className="btn-download" onClick={() => downloadAttractionsByStatus(data, s)}>
                  {s}
                </button>
              ))}
            </div>
          </div>

          <div className="download-section">
            <h3>📥 Download by Declaration Status</h3>
            <div className="download-buttons">
              {declarationStatuses.map(ds => (
                <button key={ds} className="btn-download" onClick={() => downloadAttractionsByDeclarationStatus(data, ds)}>
                  {ds}
                </button>
              ))}
            </div>
          </div>

          <div className="data-toolbar">
            <span className="grow">Total Attractions: <b>{data.length}</b></span>
          </div>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Municipality</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Declaration Status</th>
                  <th>Address</th>
                </tr>
              </thead>
              <tbody>
                {data.length === 0 ? (
                  <tr><td colSpan="6" className="empty-row">No attractions found</td></tr>
                ) : (
                  data.map((a, i) => (
                    <tr key={i}>
                      <td><strong>{a.name}</strong></td>
                      <td>{a.municipality}</td>
                      <td><span className="pill pill-teal">{a.category}</span></td>
                      <td>{a.status}</td>
                      <td><span className="pill pill-gold">{a.declarationStatus}</span></td>
                      <td style={{fontSize:11, color:"var(--subtext)"}}>{a.address}</td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==================== CBTO SECTION ====================
    function CBTOSection({ data, setData, isAdmin }) {
      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({
        municipality: '',
        name: '',
        address: '',
        contactPerson: '',
        contactNumber: '',
        maleMembers: 0,
        femaleMembers: 0,
        totalMembers: 0,
        natureOfActivity: '',
        purpose: ''
      });

      const resetForm = () => {
        setFormData({
          municipality: '',
          name: '',
          address: '',
          contactPerson: '',
          contactNumber: '',
          maleMembers: 0,
          femaleMembers: 0,
          totalMembers: 0,
          natureOfActivity: '',
          purpose: ''
        });
        setEditingId(null);
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: name.includes('Members') ? parseInt(value) || 0 : value
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const totalMembers = formData.maleMembers + formData.femaleMembers;
        const dataWithTotal = { ...formData, totalMembers, id: editingId || Date.now() };
        
        if (editingId) {
          setData(data.map(item => item.id === editingId ? dataWithTotal : item));
        } else {
          setData([...data, dataWithTotal]);
        }
        resetForm();
      };

      const handleDelete = (id) => {
        if (confirm("Delete this CBTO?")) {
          setData(data.filter(item => item.id !== id));
        }
      };

      const handleEdit = (cbto) => {
        setFormData(cbto);
        setEditingId(cbto.id);
      };

      const municipalities = [...new Set(data.map(c => c.municipality))].sort();

      return (
        <div>
          {isAdmin && (
            <div className="panel">
              <div className="panel-title">Add/Edit Community-Based Tourism Organization (CBTO)</div>
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <label className="field">
                    <span className="field-label">Municipality <span className="req">*</span></span>
                    <input type="text" name="municipality" value={formData.municipality} onChange={handleChange} required />
                  </label>
                  <label className="field">
                    <span className="field-label">CBTO Name/Address <span className="req">*</span></span>
                    <input type="text" name="name" value={formData.name} onChange={handleChange} placeholder="Organization Name" required />
                  </label>
                  <label className="field">
                    <span className="field-label">Full Address</span>
                    <input type="text" name="address" value={formData.address} onChange={handleChange} />
                  </label>
                  <label className="field">
                    <span className="field-label">Contact Person</span>
                    <input type="text" name="contactPerson" value={formData.contactPerson} onChange={handleChange} />
                  </label>
                  <label className="field">
                    <span className="field-label">Contact Number</span>
                    <input type="text" name="contactNumber" value={formData.contactNumber} onChange={handleChange} />
                  </label>
                  <label className="field">
                    <span className="field-label">Male Members</span>
                    <input type="number" name="maleMembers" value={formData.maleMembers} onChange={handleChange} min="0" />
                  </label>
                  <label className="field">
                    <span className="field-label">Female Members</span>
                    <input type="number" name="femaleMembers" value={formData.femaleMembers} onChange={handleChange} min="0" />
                  </label>
                  <label className="field">
                    <span className="field-label">Total Members (Auto)</span>
                    <input type="number" value={formData.maleMembers + formData.femaleMembers} disabled />
                  </label>
                </div>
                <label className="field">
                  <span className="field-label">Nature of Activity in Destination</span>
                  <textarea name="natureOfActivity" value={formData.natureOfActivity} onChange={handleChange} style={{width:"100%", padding:"8px 10px", border:"1px solid var(--border)", borderRadius:"6px", fontFamily:"inherit", fontSize:"14px", minHeight:"80px"}} />
                </label>
                <label className="field">
                  <span className="field-label">Purpose/Objective</span>
                  <textarea name="purpose" value={formData.purpose} onChange={handleChange} style={{width:"100%", padding:"8px 10px", border:"1px solid var(--border)", borderRadius:"6px", fontFamily:"inherit", fontSize:"14px", minHeight:"80px"}} />
                </label>
                <div className="form-actions">
                  {editingId && <button type="button" className="btn" onClick={resetForm}>Cancel</button>}
                  <button type="submit" className="btn btn-primary">{editingId ? "Update" : "Add"} CBTO</button>
                </div>
              </form>
            </div>
          )}

          <div className="download-section">
            <h3>📥 Download CBTOs</h3>
            <div className="download-buttons">
              <button className="btn-download" onClick={() => downloadCBTOByField(data, 'All')}>All CBTOs</button>
              {municipalities.map(m => (
                <button key={m} className="btn-download" onClick={() => downloadCBTOByField(data.filter(c => c.municipality === m), m)}>
                  {m}
                </button>
              ))}
            </div>
          </div>

          <div className="data-toolbar">
            <span className="grow">Total CBTOs: <b>{data.length}</b></span>
          </div>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Municipality</th>
                  <th>Organization Name</th>
                  <th>Contact Person / Number</th>
                  <th>Members (M/F)</th>
                  <th>Total</th>
                  <th>Nature of Activity</th>
                  <th>Purpose</th>
                  {isAdmin && <th>Actions</th>}
                </tr>
              </thead>
              <tbody>
                {data.length === 0 ? (
                  <tr><td colSpan={isAdmin ? 8 : 7} className="empty-row">No CBTOs found</td></tr>
                ) : (
                  data.map((cbto) => (
                    <tr key={cbto.id}>
                      <td><strong>{cbto.municipality}</strong></td>
                      <td>{cbto.name}<br/><span style={{fontSize:11, color:"var(--subtext)"}}>{cbto.address}</span></td>
                      <td>{cbto.contactPerson}<br/><span style={{fontSize:11, color:"var(--subtext)"}}>{cbto.contactNumber}</span></td>
                      <td style={{textAlign:"center"}}>{cbto.maleMembers} / {cbto.femaleMembers}</td>
                      <td style={{textAlign:"center", fontWeight:600}}>{cbto.totalMembers}</td>
                      <td style={{fontSize:12}}>{cbto.natureOfActivity}</td>
                      <td style={{fontSize:12}}>{cbto.purpose}</td>
                      {isAdmin && (
                        <td>
                          <button className="btn-ghost" onClick={() => handleEdit(cbto)} title="Edit">✎</button>
                          <button className="btn-ghost" onClick={() => handleDelete(cbto.id)} style={{color:"var(--danger)"}} title="Delete">✕</button>
                        </td>
                      )}
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App(){
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [tab, setTab] = useState("establishments");
      const [establishments, setEstablishments] = useState([]);
      const [attractions, setAttractions] = useState([]);
      const [cbtos, setCBTOs] = useState([]);

      const ADMIN_EMAILS = ["rhyant13th@gmail.com"];
      const isAdmin = user && ADMIN_EMAILS.includes(user.email);

      useEffect(() => {
        const unsub = window.auth.onAuthStateChanged(u => {
          setUser(u);
          setAuthReady(true);
        });
        return unsub;
      }, []);

      useEffect(() => {
        if (!user) return;
        // Load data from Firestore
        window.db.collection("inventory").doc("data").get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            setEstablishments(data.establishments || []);
            setAttractions(data.attractions || []);
            setCBTOs(data.cbtos || []);
          }
        }).catch(err => console.error("Load error:", err));
      }, [user]);

      const handleSave = async () => {
        if (!isAdmin) return;
        try {
          await window.db.collection("inventory").doc("data").set({
            establishments,
            attractions,
            cbtos,
            updatedAt: new Date()
          });
          alert("Data saved successfully!");
        } catch(err) {
          alert("Save failed: " + err.message);
        }
      };

      const handleLogout = () => window.auth.signOut();

      if (!authReady) {
        return <div className="app" style={{textAlign:"center", paddingTop:100}}>Checking authentication…</div>;
      }

      if (!user) {
        return <LoginScreen />;
      }

      return (<div className="app">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8}}>
          <div>
            <div className="eyebrow">PROVINCIAL TOURISM OFFICE</div>
            <h1 className="title">Tourism Enterprise & Attraction Inventory</h1>
            <div className="subtitle">
              Data inventory management by <span style={{ fontWeight: "bold", color: "#f59e0b" }}>RYAN R. TAJONERA</span>, Tourism Operations Officer II.
              {!isAdmin && <span style={{color:"var(--teal)", fontWeight:600}}> — View-only mode</span>}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <span style={{fontSize:12, color:"var(--subtext)"}}>
              {user.email} <span className="pill pill-teal">{isAdmin ? "Admin" : "Viewer"}</span>
            </span>
            <br/>
            {isAdmin && <button className="btn" onClick={handleSave} style={{marginTop:8}}>💾 Save All Data</button>}
            <button className="btn" onClick={handleLogout} style={{marginTop:8}}>Sign out</button>
          </div>
        </div>

        <div className="section-tabs">
          <button className={"section-tab " + (tab==="establishments"?"active":"")} onClick={()=>setTab("establishments")}>
            Enterprises ({establishments.length})
          </button>
          <button className={"section-tab " + (tab==="attractions"?"active":"")} onClick={()=>setTab("attractions")}>
            Attractions ({attractions.length})
          </button>
          <button className={"section-tab " + (tab==="cbtos"?"active":"")} onClick={()=>setTab("cbtos")}>
            CBTOs ({cbtos.length})
          </button>
        </div>

        {tab === "establishments" && <EnterprisesSection data={establishments} setData={setEstablishments} isAdmin={isAdmin} />}
        {tab === "attractions" && <AttractionsSection data={attractions} setData={setAttractions} isAdmin={isAdmin} />}
        {tab === "cbtos" && <CBTOSection data={cbtos} setData={setCBTOs} isAdmin={isAdmin} />}
      </div>);
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
